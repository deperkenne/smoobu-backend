services:
  pipeline:
    image: ghcr.io/deperkenne/smoobu_pipeline:latest  # publiée par le CI à chaque push sur main
    container_name: smoobu-pipeline
    restart: unless-stopped  # relancé automatiquement après un redémarrage de la VM
    env_file: .env  # secrets : copiez .env.example en .env (jamais commité)
    environment:
      SPRING_BOOT_URL: http://backend:8080  # le backend est joint par son nom de service Docker
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"  # = la VM elle-même
    volumes:
      - pipeline-data:/data  # garde pipeline_blocked.json entre deux redémarrages

  backend:
    build: .  # Dockerfile de smoobu-backend
    container_name: smoobu-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod  # pas de logs SQL comme en dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update  # Hibernate crée les tables (aucun outil de migration pour l'instant)
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy  # attend que Postgres accepte les connexions
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    container_name: smoobu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"  # accès local uniquement ; 5433 car un Postgres tourne déjà sur 5432 de l'hôte
    volumes:
      - postgres-data:/var/lib/postgresql/data  # les données survivent aux redémarrages

volumes:
  pipeline-data:
  postgres-data:
